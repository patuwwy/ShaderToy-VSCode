<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShaderToy to VSCode</title>
  <style>
    body {
      width: 280px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      color: #1e293b;
      background-color: #ffffff;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 8px;
    }
    .header h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #94a3b8;
    }
    .badge.connected {
      background-color: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
    }
    .badge.connecting {
      background-color: #f59e0b;
    }
    .badge.disconnected {
      background-color: #ef4444;
    }
    .status-row {
      font-size: 13px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .label {
      color: #64748b;
    }
    .val {
      font-weight: 500;
    }
    .port-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      gap: 6px;
    }
    input[type="number"] {
      width: 90px;
      padding: 5px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
    }
    button {
      flex: 1;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="header">
    <span id="statusBadge" class="badge disconnected"></span>
    <h3>ShaderToy to VSCode</h3>
  </div>

  <div class="status-row">
    <span class="label">Status:</span>
    <span id="statusLabel" class="val">Disconnected</span>
  </div>

  <div class="status-row">
    <span class="label">Shadertoy Tabs:</span>
    <span id="tabCountLabel" class="val">0</span>
  </div>

  <div class="port-section">
    <input type="number" id="portInput" value="27412" title="WebSocket server port" />
    <button id="savePortBtn">Apply & Connect</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
